
name: ESP-IDF Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build FlappyBird
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build ESP32 project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32
          path: .
          command: idf.py build && idf.py merge-bin -o FlappyBird-full.bin -f raw

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: FlappyBird-firmware
          path: build/FlappyBird-full.bin
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: build/FlappyBird-full.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
